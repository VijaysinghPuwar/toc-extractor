name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run has nothing to tell anyone.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The version developed against. Used wherever a single version is enough.
  PRIMARY_PYTHON: "3.14"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PRIMARY_PYTHON }}
          cache: pip
      - run: make deps
      - run: make lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PRIMARY_PYTHON }}
          cache: pip
      - run: make deps
      - run: make typecheck

  test:
    # No browser and no network: the fixture server is local and the page
    # source is a stub, so these jobs never download Chromium.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: make deps
      - name: Confirm the GUI is importable without Tk
        # Ubuntu runners have no _tkinter. If gui.bridge or gui.worker ever
        # grow a Tk import the GUI tests would silently stop running here
        # rather than fail, so assert the absence explicitly.
        run: |
          .venv/bin/python -c "
          import importlib.util, sys
          assert importlib.util.find_spec('tkinter') is None, 'expected no Tk on this runner'
          import toc_extractor.gui.bridge, toc_extractor.gui.worker
          print('gui.bridge and gui.worker import without Tk')
          "
      - run: make test-fast

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PRIMARY_PYTHON }}
          cache: pip
      - run: make deps
      - run: make test-fast

  browser:
    # One job, because Chromium is the only thing CI downloads.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PRIMARY_PYTHON }}
          cache: pip
      - run: make deps

      - name: Resolve the browser build
        id: browser
        # Keyed on the build Playwright actually resolves, not on a lockfile
        # hash: the hash changes for unrelated dependency bumps and misses a
        # browser change that comes from the same pinned Playwright range.
        # Extracted in Python rather than sed: \+ is a GNU extension, so a sed
        # one-liner works on the Linux runner and silently matches nothing
        # anywhere else - and a cache key that quietly resolves to empty is a
        # permanent cache miss nobody notices.
        run: |
          .venv/bin/python -c "
          import re, subprocess, os
          out = subprocess.run(
              ['.venv/bin/python', '-m', 'playwright', 'install', '--dry-run', 'chromium'],
              capture_output=True, text=True, check=True).stdout
          match = re.search(r'chromium-(\d+)', out)
          if not match:
              raise SystemExit('could not resolve the chromium build from:\n' + out)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              handle.write(f'build={match.group(1)}\n')
          print('resolved chromium-' + match.group(1))
          "

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ steps.browser.outputs.build }}

      - run: .venv/bin/python -m playwright install --with-deps chromium
      - run: make test-browser
